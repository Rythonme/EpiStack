name: R-CMD-check

# push / PR 时验证「包可发布 + 链路不断」两件事。
# 只跑合成数据链路，绝不需要、也不会读取任何真实监测数据。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Build source tarball
        run: R CMD build epi-core

      - name: R CMD check (0 ERROR 为准)
        # --ignore-warnings：唯一已知 WARNING 是 R 源码 UTF-8 中文注释的
        # 可移植性提示（功能不受影响）；ERROR 一律判失败。
        run: |
          R CMD check --no-manual --no-build-vignettes --ignore-warnings epiCore_*.tar.gz
          LOG=$(ls -d *.Rcheck/00check.log | head -1)
          echo "=== check log tail ==="
          tail -n 20 "$LOG"
          if grep -qE '^Status: .*ERROR' "$LOG"; then
            echo "::error::R CMD check 出现 ERROR"
            exit 1
          fi

      - name: End-to-end pipeline + golden smoke test
        # 默认只跑合成数据六层切片；--check 会以 golden 基线逐项校验，
        # 任何一层被替换后口径变了，这里当天就会红。
        run: Rscript pipeline.R --check

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r-cmd-check-log
          path: '*.Rcheck/**'

      - name: Upload synthetic report site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report-site
          path: pipeline_out/site/
